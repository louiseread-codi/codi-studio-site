# codi studio site. Netlify serves /about from about.html etc. automatically.
[[redirects]]
from = "https://codistudio.co.uk/*"
to = "https://codistudio.ai/:splat"
status = 301
force = true

# www version of the old domain, so it can't show as a second copy of the site in Google
[[redirects]]
from = "https://www.codistudio.co.uk/*"
to = "https://codistudio.ai/:splat"
status = 301
force = true

# www version of the new domain, straight to the main address in one hop
[[redirects]]
from = "https://www.codistudio.ai/*"
to = "https://codistudio.ai/:splat"
status = 301
force = true

[[redirects]]
from = "/resources"
to = "/resources.html"
status = 200
force = true

[[redirects]]
from = "/resources/:slug"
to = "/resources/:slug.html"
status = 200

# AI Partner Programme retired 27 Nov 2026 (packages dropped): send it to the AI Assessment
[[redirects]]
from = "/ai-partner-programme"
to = "/ai-assessment"
status = 301
force = true
